name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The preview lives in a subdirectory of the Pages site, so all
      # internal links need the base path.
      - run: npm run build
        env:
          BASE_PATH: /pr-preview/pr-${{ github.event.pull_request.number }}/

      # Deploys to gh-pages branch under pr-preview/pr-<number>/ and
      # posts the preview link as a PR comment.
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
