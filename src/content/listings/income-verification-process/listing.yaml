body: |-
  Streamlines the process of verifying income, reducing processing time and ensuring regulatory compliance at every step. Use this foundational blueprint by itself or in combination with other blueprints for consumer banking, commercial banking, wealth management, and so on.
features: 
  - header: "Income source validation"
    description: "Verify employment status and income sources, including cross-checking of reported income with third-party data sources."
  - header: "Document collection and verification"
    description: "Automate the collection of income-related documents such as pay stubs and tax returns. Validate documents for authenticity and accuracy."
  - header: "Income consistency analysis"
    description: "Analyze income consistency over time and identify potential discrepancies in reported income."
  - header: "Third-party data integration"
    description: "Integrate with external data sources for real-time income verification. The blueprint aggregates income data from multiple sources for comprehensive validation."
  - header: "Risk assessment and scoring"
    description: "Assess income-related risks based on verification outcomes and score applicants based on verified income and risk factors."
