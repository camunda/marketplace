features: 
  - header: "Run on your own hardware"
    description: "The entire process runs against a model on your own machine; no data leaves your infrastructure."
  - header: "Includes a ready-to-deploy Docker setup"
    description: "Includes Docker Compose modifications that bridge the connector container to host-based Ollama."
  - header: "Use Ollama as a native BPMN task"
    description: "The Ollama Chat element template makes prompt/response wiring a simple form fill in Camunda Modeler."
  - header: "Skip per-token and per-request billing"
    description: "No per-token or per-request billing because the model runs on local hardware."
  - header: "Swap in any Ollama-supported model"
    description: "Works with any Ollama-supported model — swap llama3.2, mistral, or qwen2.5 without changing the process."
