body: |-
  Automate complex financial spreading by transforming unstructured documents into decision-ready data. This AI-native agent integrates with Camunda to reduce manual workload by 80% with 100% traceability.
features: 
  - header: "Superior Accuracy (96%+)"
    description: "Leverages specialized agent configurations that exceed human baseline performance (89%) in field-match accuracy."
  - header: "Complex Document Handling"
    description: "Automatically processes a wide variety of sources, including audited annual reports, unaudited multi-month statements, and granular 1040/1120 tax forms."
  - header: "Universal File Support"
    description: "Process any input including PDFs, Excel, JPG, PNG, and TIFF. Whether it's a digital-first document or a scan of a paper filing, the agent extracts data with high precision."
  - header: "Intelligent Period Harmonization"
    description: "Automatically aligns unaligned periods and calculates LTM (Last Twelve Months) or YTD (Year-to-Date) totals, even when documents provide conflicting data."
  - header: "100% Traceability"
    description: "Every extracted value is linked back to the source document, allowing underwriters to verify and explain results with total confidence."
