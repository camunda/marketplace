body: |-
  
features: 
  - header: "Create Folder"
    description: "Create a new folder or DriveItem in a Drive with a specified parent item or path."
  - header: "List Children"
    description: "Return a collection of DriveItems in the children relationship of a DriveItem.\nDriveItems with a non-null folder or package facet can have one or more child DriveItems."
  - header: "CheckIn File"
    description: "Check in a checked out driveItem resource, which makes the version of the document available to others."
  - header: "CheckOut File"
    description: "Check out a driveItem resource to prevent others from editing the document, and prevent your changes from being visible until the documented is checked in."
  - header: "Copy File"
    description: "Creates a copy of an driveItem (including any children), under a new parent item or with a new name."
  - header: "Move File"
    description: "Move a DriveItem to a new parent item"
  - header: "Update File"
    description: "Update the metadata for a driveItem by ID or path."
  - header: "Delete File"
    description: "Delete a DriveItem by using its ID or path. Deleting items using this method moves the items to the recycle bin instead of permanently deleting the item."
  - header: "Search"
    description: "Search the hierarchy of items for items matching a query. You can search within a folder hierarchy, a whole drive, or files shared with the current user."
