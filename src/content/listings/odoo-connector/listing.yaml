description: "Seamless Odoo ERP workflow integration"
tagline: "Connect Camunda to Odoo ERP"
body: |-
  Connect Camunda processes to Odoo 19 ERP. Supports CRUD operations, search, webhooks, and polling for seamless business process automation.
features: 
  - header: "Full CRUD operations"
    description: "Create, read, update, and delete records in any Odoo model with type-safe request handling and structured responses."
  - header: "Advanced search and filtering"
    description: "Query Odoo records using domain filters with support for pagination, sorting, and field selection. Combine search and read in a single operation."
  - header: "Real-time webhooks"
    description: "Receive instant notifications from Odoo when records are created, updated, or deleted. Automatically correlate events to running process instances."
  - header: "Polling mode"
    description: "Periodically poll Odoo for new or modified records using configurable intervals and tracking fields for reliable event detection."
  - header: "Custom method execution"
    description: "Call any custom Odoo model method with full argument support, enabling integration with custom business logic and processes."
  - header: "Production-ready connector"
    description: "Built with Java 21, automatic retry logic, comprehensive error handling, and full compatibility with Camunda 8.9+ connector runtime."
