features: 
  - header: "Manage contacts"
    description: "Retrieve all contacts, get contacts by ID, or search for contacts.You can also create, update, and delete contacts."
  - header: "Manage companies"
    description: "Retrieve all companies, get company by ID, or search for companies. You can also create and delete companies."
  - header: "Manage companies' contacts"
    description: "Get all contacts of a company, add contacts to a company, or remove contacts from a company."
  - header: "Manage deals"
    description: "Retrieve all deals, get deal by ID, or search for deals. You can also use this feature to delete deals."
  - header: "Additional features"
    description: "Submit forms, enroll contacts in a workflow, and add elements to lists."
