body: |-
  Integrate SAP into business processes using OData v2 and V4. This connector complies with SAP's Clean Core strategy, ensuring it's future-proof.
features: 
  - header: "Integrate with SAP applications using OData"
    description: "Execute outbound OData v2 and V4 calls, facilitating task execution and data integration between Camunda-powered processes and SAP systems."
  - header: "Efficient interactions via batch requests"
    description: "Use OData batch requests to implement complex API interactions efficiently."
  - header: "Enable secure communications with SAP"
    description: "Use basic authentication to enable Camunda-based processes to interact with SAP systems."
  - header: "Leverage advanced features"
    description: "Configure advanced OData parameters such as $filter and $select."
  - header: "Handle errors with process logic"
    description: "Use process variables to capture errors returned by OData calls, enabling teams to use the BPMN process modeling standard to handle business-relevant errors; for example, by designing backup flows."
