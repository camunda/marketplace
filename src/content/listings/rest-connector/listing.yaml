features: 
  - header: "Make GET Requests"
    description: "Whether you're collecting data for analytics, fetching configuration settings, or populating your application with external data, GET requests enable you to retrieve information easily from any RESTful API."
  - header: "Execute POST, PUT, PATCH Operations"
    description: "Need to update a record, create a new entry, or modify configurations? The REST Connector allows you to execute POST, PUT, and PATCH operations seamlessly, making real-time data manipulation a breeze."
  - header: "Handle DELETE Operations"
    description: "When you need to remove records or data, you can use the DELETE operation. This feature is particularly useful in scenarios such as user account deletion, purging old records, or any other cleanup tasks."
  - header: "Secure and Robust"
    description: "With built-in support for authentication mechanisms such as JWT, Basic, and OAuth, the REST Connector ensures your API interactions are secure. Moreover, it is engineered for high performance and can handle a large number of simultaneous API calls without affecting system stability."
