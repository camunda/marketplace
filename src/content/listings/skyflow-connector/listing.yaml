description: "Protect sensitive data in processes"
tagline: "Protect your data from AI and integration leaks"
body: |-
  Protect sensitive data in Camunda-powered business processes. This connecter uses Skyflow Detect to de-identify sensitive fields in structured JSON data and re-identify previously tokenized values. It locates sensitive information such PII, PHI, and PCI from text, PDFs, images, and audio files and then redacts that information with tokens. You can use this de-identified data for a variety of tasks such as model training, fine tuning, running secure inference, performing privacy-aware analytics, or any other operational task that requires de-identified unstructured data.
features: 
  - header: "Automated de-identification of sensitive data"
    description: "Detect and tokenize sensitive information across multiple data types, replacing it with secure tokens that can be used safely in downstream processes."
  - header: "Vault-backed tokenization and re-identification"
    description: "Store sensitive data securely in Skyflow's vault and re-identify tokens only when permitted. This enables controlled access for authorized use cases such as audits, investigations, and customer service."
  - header: "Privacy-safe AI and analytics enablement"
    description: "Use de-identified data for AI model training, fine-tuning, secure inference, and privacy-aware analytics, without risking data leakage or regulatory violations."
