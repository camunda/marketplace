features: 
  - header: "User and Team Management"
    description: "Manage user and team entities and integrate them into your on- and off-boarding processes without disrupting your current workflows."
  - header: "Manage Absences for Accurate Planning"
    description: "Align your schedule with planned and unplanned absences to be always up to date in your planning."
  - header: "Get Absence Reporting for Better Oversight"
    description: "Integrate absence numbers into your planning processes. Easily track and analyze patterns without the need for additional tools."
  - header: "Travel Expense Integration"
    description: "Create your own customized travel expense process and integrate MOCO right into it as the leading data system."
  - header: "Invoice Handling"
    description: "Integrate invoice handling into your HR and financial processes, allowing you e.g. to monitor and manage late payments."
