description: "Don't let exceptions cap growth"
tagline: "From Chaos to Capacity: How BP3 Turns Logistics Exceptions into Growth with ABBYY and Camunda"
body: |-
  Turn messy orders and documents into clean data, then immediately orchestrate only the exceptions that matter. This creates the foundation for a control tower and AI-governed decisions later.
features: 
  - header: "Outcomes include:"
    description: "Protect margins at scale with fewer downstream execution errors. Ops teams move from “doers” to “exception managers,\" increasing orders per Ops FTE. New customers and increased volume are absorbed without proportional hiring, resulting in a percentage reduction in manual order handling effort."
  - header: "Intelligent Order Intake using ABBYY"
    description: "ABBYY turns documents into usable data, and tells us what it’s unsure about, immediately identifying clean vs questionable orders\nOrder intake with ABBYY can look like:\n- An email arrives with an attached PDF order (or rate con / BOL).\n- ABBYY extracts shipment details: shipper/consignee, dates, equipment, accessories, refs, commodity, special handling.\n- ABBYY flags confidence + missing fields."
  - header: "Single Orchestration layer for all operational exceptions and audit trail"
    description: "Using a single Orchestration layer with ABBYY's extracted payload with confidence scores creates a high powered, scalable control plan. Every Order becomes a tracked case with business rules, SLAs, and an audit trail. Since exceptions are routed, prioritized, and resolved with context instead of email archaeology, margins don't suffer as order volumes scale."
  - header: "Operations Cockpit"
    description: "A role-based view of \"At-risk today\" exceptions by SLA tier, bottlenecks by exception type, average time-to-resolve by queue/team, and margin-at-risk totals. Now we can run ops by exception and measure the root causes so process fixes can actually stick. "
  - header: "SLA-driven prioritization"
    description: "Every order becomes a tracked case with rules, SLAs, and an audit trail."
