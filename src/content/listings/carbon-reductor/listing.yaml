features: 
  - header: "Time shifting"
    description: "Using the time shifting mode (default) the Carbon Reductor Connector allows you to optimize for lower carbon emissions by moving your process execution into a timeframe with the least amount of carbon possible while still fulfilling SLAs."
  - header: "Measurement"
    description: "Using the measuring mode the Carbon Reductor Connector allows you to measure the emissions in gCO2e/KWh at execution time and reports as well the emissions at the optimal time while still fulfilling your SLAs."
