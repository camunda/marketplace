body: |-
  Automate GitLab project management, issue tracking, and software release processes to manage your entire DevOps cycle in one centralized Camunda environment.
features: 
  - header: "Get, Create, Delete an Issue"
    description: "Automate the retrieval, creation, and deletion of GitLab issues directly from Camunda-based processes."
  - header: "Comment on an Issue"
    description: "Auto-generate or manually add comments to GitLab issues, setting the level of confidentiality as needed."
  - header: "Search Issues"
    description: "Execute custom searches for GitLab issues using parameters such as scope, state, assignee ID, username, and text within the issue title and description."
  - header: "List All Releases by Project ID"
    description: "Automatically pull a list of all releases for specific projects. This feature is useful for generating release reports and planning deployments."
  - header: "Get Release by a Tag Name"
    description: "Retrieve specific release details via tag name, aiding in version control and release management."
  - header: "Create a Release"
    description: "Create GitLab releases from Camunda-based processes, including setting the tag, ref, release name, and description."
