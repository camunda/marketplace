  FHIR Connector for Camunda automates clinical workflows with SMART-on-FHIR security, real-time EHR triggers, and native FHIR R4 resource orchestration.
features: 
  - header: "Orchestrate standard FHIR resources"
    description: "Native support for standard FHIR resources (Patient, Observation, Encounter, Claim, and others) via a drag-and-drop interface."
  - header: "Secure access with SMART-on-FHIR"
    description: "Pre-configured OAuth2 and OIDC authentication patterns to ensure HIPAA-compliant data access."
  - header: "Map FHIR data to process variables"
    description: "Simplifies the transformation between FHIR JSON structures and Camunda process variables."
  - header: "Trigger processes from clinical events"
    description: "Enables Camunda to listen for FHIR resource changes via subscriptions to trigger automated processes instantly."
