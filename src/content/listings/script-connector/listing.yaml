tagline: "Execute any script from your Camunda processes"
body: |-
  The Script Connector lets you call any scripting language directly from a Camunda process. It ships with built-in support for JavaScript, Kotlin, Groovy, and Mustache, plus an extensible framework for registering custom scripting engines via SPI.
features: 
  - header: "Execute embedded and resource scripts"
    description: "Define scripts directly in the properties panel as embedded content, or specify a resource path and the connector will execute the script from there."
  - header: "Use any JSR-223 compliant scripting engine"
    description: "Plug in any JSR-223 compliant scripting engine as-is, without additional configuration."
  - header: "Get started with pre-bundled scripting languages"
    description: "The connector ships with JavaScript, Kotlin, Groovy, and Mustache support out of the box."
  - header: "Register arbitrary scripting engines"
    description: "Bridge execution to any scripting language by implementing an interface and registering it via SPI."
