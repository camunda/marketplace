body: |-
  Integrate any external webhook into your Camunda processes. Supports all HTTP methods and offers robust security through JWT, Basic, API KEY, and HMAC authentication.
features: 
  - header: "Supports All HTTP Methods"
    description: "Flexible to manage GET, POST, PUT, DELETE, PATCH, and more, making this Connector versatile for any external integration."
  - header: "Multiple Authorization Mechanisms"
    description: "JWT allows integration with services that use JSON Web Tokens for security. Basic authentication leverages username and password authentication for simplicity. API key integration allows you to work with services that use API keys for authentication."
  - header: "HMAC Authentication"
    description: "Provides an extra layer of security by requiring the request to be signed by a secret key."
