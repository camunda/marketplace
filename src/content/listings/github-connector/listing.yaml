tagline: "Orchestrate Your Software Development Lifecycle with Camunda and GitHub"
body: |-
  Manage GitHub repositories, issues, and more directly through Camunda to automate your entire software development process.
features: 
  - header: "Create, Get, Update an Issue"
    description: "Automate the creation and updating of issues from Camunda processes whenever a new feature is proposed or a bug is detected."
  - header: "Create an Issue, Comment, Search Issue"
    description: "Create GitHub issues or search for GitHub issues based on various parameters. This feature is perfect for issue tracking and documentation."
  - header: "List, Get, Merge a Branch"
    description: "Automate branch management tasks to enforce coding standards or to initiate automated testing and deployment."
  - header: "List Code Scanning Alerts"
    description: "Retrieve code quality metrics and security vulnerability reports and use them to trigger appropriate Camunda processes."
  - header: "Create an Organization Invitation"
    description: "Automate the process of inviting new members to your GitHub organization. This feature is ideal for employee onboarding."
  - header: "Create, Update, Delete, List Releases"
    description: "Automate the release process by creating or updating GitHub releases based on milestones achieved in a Camunda-based process."
  - header: "List, Create, Get, Update, Delete a Repository, List Contributors"
    description: "Automate repository creation and repository management based on project needs or internal requirements."
  - header: "Trigger Process by Webhook from GitHub"
    description: "Initiate a Camunda process instance based on GitHub events such as pushes, pull requests, and issue comments."
