tagline: "Automate and Optimize Media Processing with AWS Elemental MediaConvert"
body: |-
  Use Camunda to orchestrate AWS Elemental tasks for video transcoding. Adjust frame rates and resolution, add caption and audio tracks, merge multiple videos, overlay images onto videos, and more. The blueprint also supports file uploads and downloads from Amazon S3, content moderation detection, and generating presigned URLs for secure delivery.
features: 
  - header: "Transcode Videos"
    description: "Efficiently convert videos to different formats with support for advanced operations. You can transcode videos to the latest codecs such as AV1, ensuring optimal compression and quality. Additionally, the blueprint allows you to adjust the video frame rate to common standards such as 24fps, 30fps, and 60fps, catering to various broadcasting and streaming requirements. You can also change video resolutions, making it easy to adapt content for different devices and screen sizes."
  - header: "Overlay Image"
    description: "Enhance your videos with the capability to overlay images at precise pixel coordinates. This feature provides flexibility to adjust the overlay’s opacity, allowing for subtle or prominent imagery. You can also specify fade-in and fade-out durations for the overlay, creating smooth transitions that enhance the viewer's experience. Whether adding logos, watermarks, or promotional graphics, this functionality offers extensive customization to meet your needs."
  - header: "Mix Audio and Video"
    description: "Seamlessly add an audio track to your video files, enhancing the multimedia experience. The blueprint supports mixing an AAC audio track with the video, making it ideal for adding background music, voiceovers, or sound effects. This feature is particularly useful for creating polished and professional content, whether for marketing, education, or entertainment purposes."
  - header: "Combine Videos"
    description: "Merge multiple videos into a single, cohesive output with ease. This feature allows you to append one video directly to the end of another, enabling simple concatenation of clips. Whether you’re assembling highlight reels, creating comprehensive presentations, or compiling video series, this functionality streamlines the process and ensures a smooth playback experience."
  - header: "Add Caption Track"
    description: "Improve accessibility and engagement by embedding subtitle tracks into your videos. The blueprint supports the inclusion of SRT (SubRip Subtitle) files, allowing you to provide synchronized captions that enhance the viewer's understanding and enjoyment. This is especially valuable for reaching a broader audience, including those with hearing impairments or who speak different languages."
