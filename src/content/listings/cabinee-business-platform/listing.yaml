  - header: "Manage tasks and approvals out of the box"
    description: "Assigns, executes, and controls user tasks within the process, with out-of-the-box execution control and approvals."
  - header: "Track activity and events automatically"
    description: "Tracks comments, events, and a complete history of incoming and outgoing correspondence."
