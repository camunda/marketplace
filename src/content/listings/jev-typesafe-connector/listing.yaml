body: |-
  Use TypeSafe's Jev model to classify, score, or judge any piece of text or structured data, and get back reliable, structured answers your process can act on directly.
features: 
  - header: "Flexible judgments in one step"
    description: "Ask several questions about the same data in one task. Tailor the choice criteria and scoring scale to your workflow: classify a support request, score customer frustration, and check urgency together."
  - header: "Structured answers for process decisions"
    description: "Receive typed answers, confidence scores, and probabilities as process data. Route work, prioritize cases, or trigger reviews using Camunda gateway conditions instead of parsing free-form AI text."
  - header: "Simple Camunda integration"
    description: "Integrates through an element template that runs on Camunda's standard HTTP connector. No custom worker or additional connector runtime needs to be deployed."
