body: |-
  Enhance your Camunda BPMN workflows with the 'MongoDB Connector' by Acheron Software Consultancy Pvt Ltd. Seamlessly integrate MongoDB, enabling flexible data management within your workflow processes. Create, retrieve, update, and delete MongoDB documents effortlessly, while ensuring data accuracy and scalability. Connect Camunda with MongoDB for streamlined automation and dynamic data handling
features: 
  - header: "Flexible Data Management"
    description: "Create and manage MongoDB collections directly within your Camunda BPMN processes, adapting to evolving data schemas effortlessly."
  - header: "Seamless Integration"
    description: "Connect Camunda BPMN with MongoDB, bridging the gap between workflow automation and dynamic data management."
  - header: "Document Retrieval"
    description: "Retrieve MongoDB documents with support for Filters, Sort, Projections, and Filters, ensuring precise data access."
  - header: "Document Updates"
    description: "Update document fields within a collection with support for Filters and Limit, maintaining data accuracy and consistency."
  - header: "Document Deletion"
    description: "Easily delete documents in a collection with support for Filters and Limit, enhancing data hygiene and compliance."
  - header: "Collection and Database Management"
    description: "Streamline administrative tasks by deleting collections and entire databases, optimizing data resources."
  - header: "Scalable Applications"
    description: "Develop scalable applications with MongoDB's flexible architecture, ideal for evolving data needs."
  - header: "Data Security"
    description: "Leverage MongoDB's robust security features to safeguard your data within Camunda BPMN workflows."
  - header: "Enhanced Efficiency"
    description: "Boost workflow efficiency by seamlessly integrating MongoDB capabilities into your Camunda BPMN processes."
