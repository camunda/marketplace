tagline: "Integrate NoSQL Databases with the Amazon DynamoDB Connector"
body: |-
  Integrate DynamoDB, Amazon's NoSQL database service, with Camunda process orchestration. From table creation to item updates, experience unparalleled data management and integration.
features: 
  - header: "Create Table"
    description: "Easily set up a new DynamoDB table right from Camunda-based processes, ensuring swift initialization of data storage."
  - header: "Delete Table"
    description: "Safely remove an existing DynamoDB table, allowing for efficient data management and restructuring when needed."
  - header: "Describe Table"
    description: "Obtain detailed information about a specific DynamoDB table, aiding in informed decision-making and process orchestration."
  - header: "Scan Table"
    description: "Access and retrieve items from a table based on specific criteria, ensuring targeted data acquisition for your processes."
  - header: "Add Item"
    description: "Introduce a new item or replace an existing one, ensuring data consistency and up-to-date records."
  - header: "Delete Item"
    description: "Remove specific items using primary keys, streamlining data management and maintaining data relevance."
  - header: "Get Item"
    description: "Fetch specific attributes for a particular item using its primary key, ensuring precise data retrieval for process inputs."
  - header: "Update Item"
    description: "Modify attributes of an existing item or add a new entry if it doesn't exist, guaranteeing up-to-date and comprehensive data storage."
