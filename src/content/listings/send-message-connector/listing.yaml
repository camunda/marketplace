description: "Invoke the message API without a worker"
tagline: "Publish or correlate BPMN messages without writing code"
body: |-
  Publish or correlate BPMN messages in business processes without writing code. This connector provides robust error handling and supports reusability through element templates.
features: 
  - header: "Publish or correlate messages"
    description: "Decide which API to use for sending messages. Publish with buffering or correlate with synchronous feedback. All parameters of the API are supported and can be set dynamically, if required."
  - header: "Combine with multiple BPMN symbols"
    description: "Use the Send Message connector with popular BPMN symbols such as Send Tasks, Intermediate Throw Message Events, and Message End events."
  - header: "Configure correlation key and payload"
    description: "Configure the correlation key and the payload using a Friendly Enough Expression Language (FEEL) expression."
