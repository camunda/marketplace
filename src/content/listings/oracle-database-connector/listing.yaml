features: 
  - header: "Insert Data"
    description: "Automate the insertion of rows into Oracle tables, streamlining tasks such as data ingestion or record creation. Useful in processes that add new customer records, configuration data, or any other required information."
  - header: "Read Data"
    description: "Fetch data from Oracle tables for use in your automated processes. Whether for analytics, reporting, or decision-making, this feature allows you to read data based on custom queries."
  - header: "Alter Table"
    description: "Enable a wide range of table alterations within your automated processes. From changing data types to adding or dropping columns and constraints, this feature provides flexibility for managing Oracle table structures."
  - header: "Create Table"
    description: "Automate Oracle table creation. This feature is ideal for processes that set up new environments or data structures. Use this feature to initialize new modules or services that require specific tables in the database."
  - header: "Delete Data"
    description: "Incorporate automated data deletion based on custom conditions in your Oracle tables. Ideal for processes that manage data lifecycle, prune outdated records, or clean up temporary data."
  - header: "Update Data"
    description: "Automate the update of existing records in Oracle tables based on custom conditions. Whether for periodic data synchronization or record correction, this feature allows you to keep your data current."
