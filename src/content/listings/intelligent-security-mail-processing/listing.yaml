description: "AI-powered analysis of suspicious emails"
tagline: "Stop phishing before users click"
body: |-
  Employees forward suspicious emails and receive an AI-generated Guardian Report with a clear verdict. Camunda orchestrates privacy-safe threat analysis with Amazon Bedrock.
features: 
  - header: "Report suspicious emails effortlessly"
    description: "Forward a suspicious email to a dedicated mailbox, and the process takes over from there. You need no tools, training, or security knowledge."
  - header: "Protect privacy by design"
    description: "Detect and mask names and other personal data before any AI analysis, and keep GDPR requirements in focus with a single EU-hosted data processor."
  - header: "Classify threats with AI"
    description: "Classify threats such as phishing, CEO fraud, malware, scams, and ransomware with an LLM on Amazon Bedrock, and rate severity and confidence. Forwarding-aware logic reliably distinguishes the forwarder from the original sender."
  - header: "Get an actionable Guardian Report"
    description: "Receive a clear HTML report with threat type, severity, and concrete recommended actions, and turn uncertainty into the right next step within minutes."
  - header: "Orchestrate the entire process with Camunda"
    description: "Orchestrate intake, metadata retrieval, anonymization, AI assessment, and report delivery with Camunda, and gain full transparency and traceability for every analyzed email."
