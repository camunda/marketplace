description: "AI-powered security incident analysis and decisions"
tagline: "Automate security incident triage and decision-making"
body: |-
  This blueprint automates the analysis and triage of security incidents for security operations center teams. It normalizes incoming security events, enriches them with threat intelligence and asset context, and applies consistent decision logic to identify which incidents require action. Confirmed incidents are routed to downstream systems such as ServiceNow, while false positives are filtered out automatically.
  The goal is to automatically structure and categorize incoming security events and, based on this, make consistent and traceable decisions.
  
  - The focus is on clearly separating:
  
  - Data preparation (ingest & normalization)
  
  - Technical interpretation (topic & context)
  
  - Decision logic (AI Incident Planner)
features: 
  - header: "Check threat intelligence"
    description: "Checks IP addresses and other indicators against known threat data from external sources."
  - header: "Look up asset infrastructure"
    description: "Identifies internal systems, their criticality, and the organizational units responsible for them."
  - header: "Assess GDPR relevance"
    description: "Assesses whether an incident involves personal data and whether regulatory measures are required."
  - header: "Integrate with operational systems"
    description: "Sends relevant and confirmed security incidents to downstream systems such as ServiceNow, while filtering out false positives so only validated incidents are forwarded."
  - header: "Reduce manual analysis effort"
    description: "Structured processing and consistent decision logic reduce manual review and deliver reproducible incident assessments across the SOC."
  - header: "Support audit-ready compliance"
    description: "Every incident decision is documented to support ISO 27001 and GDPR requirements, giving auditors a clear, traceable record and helping teams detect relevant incidents early."
