body: |-
  This blueprint demonstrates how to improve the mortgage origination process by automating validation and compliance tasks. It focuses on development skills, best practices, and architectural understanding.
features: 
  - header: "Buyer Validation"
    description: "Validate important information about the buyer with tasks such as document verification, credit check, income verification, and so on."
  - header: "Property Validation"
    description: "Validate important information about the property being purchased with tasks such as title insurance validation, property appraisal, insurance (proof of insurability), condo or homeowners' association (HOA) checks, and so on."
  - header: "Underwriting"
    description: "Integrate mortgage underwriting that's executed externally (with data integrations) and internally."
  - header: "Approval Cycle"
    description: "Incorporate a review cycle that includes notifications with regulatory recording."
  - header: "Settlement and Funding"
    description: "Orchestrate settlement and funding activities with the required bank information, wire details, and so on."
