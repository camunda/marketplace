features: 
  - header: "Easy claim initiation"
    description: "Customers file claims through their preferred channel (app, website, or phone). AI-powered chat and voice agents guide the process, answer questions, and capture complete details the first time."
  - header: "Seamless document handling"
    description: "Intelligent document processing (IDP) engines extract policy numbers, medical details, or damage descriptions, reducing errors and accelerating setup."
  - header: "AI-powered assessment"
    description: "AI models validate claims, detect fraud, and analyze images, auto-approving simple cases and escalating complex ones."
  - header: "Intelligent task assignment"
    description: "Adjusters are assigned tasks based on expertise, workload, or location for faster resolutions."
  - header: "Continuous optimization"
    description: "Analytics refine AI and decision rules to continually improve efficiency."
