body: |-
  Automate Google Meet meeting creation, scheduling, updates, and cancellations directly from Camunda processes. Connect to Google Calendar and Google Meet APIs using secure OAuth 2.0 authentication.
features: 
  - header: "Create and manage meetings"
    description: "Create instant Google Meet links or schedule meetings through Google Calendar directly from a BPMN service task. Retrieve, update, or cancel meetings as part of onboarding, approvals, customer engagement, and operational processes."
  - header: "Automate invitations and attendee management"
    description: "Invite attendees automatically, generate calendar events with Google Meet links, and manage meeting participants through process automation. Streamline meeting coordination and communication without manual effort."
  - header: "Secure authentication and workflow integration"
    description: "Authenticate securely using Google OAuth 2.0. Configure meeting operations through connector templates and make meeting information available to subsequent process tasks and decisions."
