body: |-
  Leverage AI and process orchestration to streamline accounts payable invoice processing, with built-in compliance, reporting, exception handling, and more.
features: 
  - header: "Data entry automation"
    description: "Leverage intelligent, OCR-based invoice data extraction and eliminate the need for manual data entry."
  - header: "Process automation"
    description: "The solution automates process steps using generative AI, executes rule-based fraud detection and risk mitigation, and uses a built-in exception management process to handle issues."
  - header: "Reusable framework"
    description: "The solution's integration framework is based on the Cloud Application Modeling and Execution Language (CAMEL). It also offers a configurable UI and service layer framework."
  - header: "Built-in compliance and approvals"
    description: "Get an end-to-end audit trail with comprehensive reporting. Leverage dynamic, multi-level approvals for exceptions."
  - header: "Analytics and search"
    description: "Get real-time insights with analytics and dashboards, plus end-to-end tracking of invoices using breadcrumbs and reports and semantic search based on generative AI."
