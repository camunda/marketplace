tagline: "Automate GCC Motor Claims with Camunda"
body: |-
  This solution validates First Notice of Loss (FNOL) inputs, triggers claim processes instantly, supports Gulf Cooperation Council (GCC) identity formats, and integrates with policy/claims systems.
features: 
  - header: "GCC identity and vehicle validation"
    description: "Validates Emirates ID, Iqama, QID, CPR, Civil ID, and GCC plate formats before triggering processes."
  - header: "Instant FNOL process initiation"
    description: "Automatically starts Camunda-based processes with routing, approvals, fraud checks, and SLA timers."
  - header: "Multi-channel integration"
    description: "Accept FNOL data from web forms, bots, mobile apps, call centers, and external systems."
  - header: "Multilingual support"
    description: "Supports six GCC-relevant languages including Arabic (RTL), Urdu (RTL), Hindi, Malayalam, Filipino, and English."
  - header: "Fraud pre-screening"
    description: "Performs parallel fraud checks on submission and provides a risk score for workflow routing."
  - header: "Built for GCC insurance regulations"
    description: "Handles regional compliance, claim structures, policy references, and jurisdictional claim rules."
