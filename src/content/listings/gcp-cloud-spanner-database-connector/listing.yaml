tagline: "Take advantage of unlimited scalability with relational semantics by connecting you Applications and workflow to Google's NewSQL database i.e) Cloud Spanner with the help of Acheron's Cloud Spanner Connector"
body: |-
  Elevate your Camunda workflows with the 'Cloud Spanner Connector' by Acheron. Seamlessly integrate Camunda with Google Cloud's NewSQL database, Cloud Spanner. Efficiently manage data by creating tables, inserting, updating, and deleting data, and retrieving records with advanced filtering options. Achieve limitless scalability and relational semantics for your applications and workflows with our Cloud Spanner Connector.
features: 
  - header: "Seamless Integration"
    description: "Connect Camunda with Google Cloud Spanner, bridging the gap between workflow automation and Google's NewSQL database."
  - header: "Table Management"
    description: "Create new tables within your specified database, optimizing data organization for your workflow applications."
  - header: "Data Insertion"
    description: "Insert data into Cloud Spanner tables with ease, ensuring efficient data population for your applications."
  - header: "Data Updates"
    description: "Update data in tables based on specified conditions, maintaining data accuracy and relevance."
  - header: "Data Deletion"
    description: "Remove data from tables based on given conditions, enhancing data hygiene and compliance."
  - header: "Data Retrieval"
    description: "Retrieve data from Cloud Spanner tables with support for Limit, Sort, and Filters, enabling precise data access."
  - header: "Scalability"
    description: "Take advantage of Cloud Spanner's unlimited scalability, perfect for handling evolving data needs."
  - header: "Data Security"
    description: "Leverage Google Cloud Spanner's robust security features to safeguard your data within Camunda BPMN workflows."
  - header: "Enhanced Efficiency"
    description: "Boost workflow efficiency by seamlessly integrating Cloud Spanner capabilities into your Camunda BPMN processes."
