description: "Simulate any connector for testing"
tagline: "Simulate any Camunda connector"
body: |-
  The Chameleon connector mimics any connector so you can build and test processes before the real integration is ready. Simulate delays, produce variables, trigger BPMN errors, or work with documents on demand.
features: 
  - header: "Simulate delays and set variables"
    description: "Delay connector execution to simulate a real connector, then return variables. Provide multiple sets of variables, each with an assigned probability, to vary the response."
  - header: "Throw BPMN errors on demand"
    description: "Configure different BPMN errors, each with an assigned probability, to simulate real error conditions during testing."
  - header: "Access and produce documents"
    description: "Provide a document reference to verify that a document was produced correctly. The connector can also write a document to simulate real output."
